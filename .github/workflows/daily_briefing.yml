name: AI Daily Briefing Push

on:
  schedule:
    # UTC 00:00 = 北京时间每天早上 08:00
    - cron: '0 0 * * *'
  # 支持在 GitHub 网页上随时手动点按钮测试
  workflow_dispatch:

jobs:
  push-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install openai feedparser httpx python-dotenv

      - name: 生成并推送简报到微信
        working-directory: backend
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: https://api.deepseek.com
          LLM_MODEL: deepseek-chat
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python daily_push.py