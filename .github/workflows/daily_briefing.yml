name: Daily AI Briefing

on:
  schedule:
    # 每天北京时间早上 8:00（UTC 00:00）自动运行
    - cron: '0 0 * * *'
  # 允许在 GitHub 网页上随时手动点击测试
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-briefing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt

      - name: Run daily briefing and push to WeChat
        working-directory: backend
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          python daily_push.py

      - name: Commit and push updated JSON data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add frontend/public/data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update daily briefing data" && git push)